services:
  nginx:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - dashboard
      - web
      - ai
      - admin
    networks:
      - app_net

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    volumes:
      - ./apps/backend/api:/var/www/api
    networks:
      - app_net

  reverb:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: php artisan reverb:start --host="0.0.0.0" --port=8080
    volumes:
      - ./apps/backend/api:/var/www/api
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - app_net

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_net

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    volumes:
      - ./apps/frontend/dashboard:/app
    networks:
      - app_net

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    volumes:
      - ./apps/frontend/web:/app
      - web_node_modules:/app/node_modules
    networks:
      - app_net

  ai:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    volumes:
      - ./apps/ai:/app
    networks:
      - app_net

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    volumes:
      - ./apps/frontend/admin:/app
      - /app/node_modules
    networks:
      - app_net

volumes:
  db_data:
  web_node_modules:

networks:
  app_net:
    driver: bridge

