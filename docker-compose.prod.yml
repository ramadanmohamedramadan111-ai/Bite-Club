services:
  web:
    image: alpine
    command: ["echo", "disabled in prod"]
    networks:
      - app_net

  web-prod:
    depends_on:
      - api
      - ai

  ai:
    restart: on-failure
    command: >
      sh -c "until python3 -c \"import MySQLdb; MySQLdb.connect(host='db',port=3306,user='laravel',passwd='secret',db='laravel')\" 2>/dev/null;
      do echo 'Waiting for MySQL...' && sleep 3; done && python manage.py runserver 0.0.0.0:8000 --noreload"

  dashboard: {}

  admin: {}

  nginx:
    ports:
      - "80:80"
      - "5173:5173"
      - "5174:5174"
    volumes:
      - ./nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web-prod
      - ai
