services:
  nginx:
    ports:
      - '80:80'
    volumes:
      - ./nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - dashboard
      - web-prod
      - ai
      - admin

  web:
    profiles:
      - dev-only

  web-prod:
    depends_on:
      - api
      - ai
