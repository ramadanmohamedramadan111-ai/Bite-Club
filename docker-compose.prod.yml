services:
  web:
    image: alpine
    command: ["echo", "disabled in prod"]
    networks:
      - app_net

  web-prod:
    depends_on:
      - api
      - ai

  ai:
      restart: on-failure
      command: python manage.py runserver 0.0.0.0:8000 --noreload

      
  dashboard: {}

  admin: {}

  nginx:
    ports:
      - "80:80"
      - "5173:5173"
      - "5174:5174"
    volumes:
      - ./nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web-prod
      - ai
