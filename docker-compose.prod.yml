services:
  nginx:
    ports:
      - '80:80'
    volumes:
      - ./nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - dashboard
      - web-prod
      - ai
      - admin


  web:
    image: alpine
    command: ["echo", "web dev disabled in production"]
    networks:
      - app_net

  web-prod:
    depends_on:
      - api
      - ai
