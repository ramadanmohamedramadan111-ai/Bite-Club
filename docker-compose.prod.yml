services:
  web:
    image: alpine
    command: ["echo", "disabled in prod"]
    networks:
      - app_net

  web-prod:
    depends_on:
      - api
      - ai

  ai:
      restart: on-failure
      command: python -u manage.py runserver 0.0.0.0:8000 --noreload


  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard.prod
    volumes: []

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin.prod
    volumes: []

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./apps/backend/api:/var/www/api
    depends_on:
      - db
      - api
    networks:
      - app_net

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: php artisan schedule:work
    volumes:
      - ./apps/backend/api:/var/www/api
    depends_on:
      - db
      - api
    networks:
      - app_net

  nginx:
    ports:
      - "80:80"
      - "5173:5173"
      - "5174:5174"
    volumes:
      - ./nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web-prod
      - ai
